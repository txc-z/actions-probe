name: Build ForkClient APK (hide-from-blocked)

# Builds forkgram/TelegramAndroid at a pinned commit with
# hide-from-blocked-users.diff applied (port of forkgram/tdesktop PR #183:
# hide messages from blocked users in group chats). The APK is published
# as a release asset of THIS repository.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-apk.yml
      - hide-from-blocked-users.diff
  workflow_dispatch:

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nttld/setup-ndk@v1.4.2
        id: setup-ndk-r27c
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install NDK for the JNI build (ndkVersion).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Cache Gradle home.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-afat-${{ github.run_id }}
          restore-keys: |
            gradle-afat-
      - name: Cache ccache.
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-afat-${{ github.run_id }}
          restore-keys: |
            ccache-afat-
      - name: Clone TelegramAndroid and apply patch.
        run: |
          git clone --recurse-submodules --branch dev https://github.com/forkgram/TelegramAndroid.git android
          cd android
          git checkout 56e6bbeae0d06ac4e806047297b02d98282afe14
          git submodule update --init --recursive
          git apply --check ../hide-from-blocked-users.diff
          git apply ../hide-from-blocked-users.diff
          git diff --stat
      - name: Build.
        working-directory: android
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          # API credentials come from this repo's Actions secrets
          # (APP_ID / APP_HASH); without them, fall back to the public
          # sample credentials that BuildVars.java itself carries (APP_ID=4).
          # Signing falls back to TMessagesProj/config/test.keystore because
          # RELEASE_KEYSTORE_FILE is intentionally not set.
          vars=gradle.properties
          echo "org.gradle.workers.max=1" >> $vars
          echo "org.gradle.caching=true" >> $vars
          echo "APP_ID=${APP_ID:-4}" >> $vars
          echo "APP_HASH=${APP_HASH:-014b35b6184100b085b0d0572f9b5103}" >> $vars

          sudo apt update
          sudo apt -y install ninja-build meson nasm gperf pkg-config unzip pip ccache
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.96.1 -t aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

          # Route the CMake native build through ccache (restored above).
          # The launcher args are injected into the pinned tree only; the
          # grep makes a silent sed no-match fail the step instead of
          # quietly building uncached.
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache --zero-stats
          sed -i "s/'-DANDROID_PLATFORM=android-23'/'-DANDROID_PLATFORM=android-23', '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'/" TMessagesProj/build.gradle
          grep -q "CMAKE_CXX_COMPILER_LAUNCHER=ccache" TMessagesProj/build.gradle

          ./gradlew :TMessagesProj_App:assembleAfatRelease
          ccache --show-stats

          grep VERSION_NAME TMessagesProj/build/generated/source/buildConfig/release/org/telegram/messenger/BuildConfig.java | cut -d'"' -f 2 > ../ver.txt
          mkdir -p ../artifact
          mv TMessagesProj_App/build/outputs/apk/afat/release/app.apk ../app.apk
          cp ../app.apk "../artifact/ForkClient $(cat ../ver.txt) hide-blocked.apk"
          ls -la ../artifact
      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: forkclient-apk
          path: artifact/
          if-no-files-found: error
      - name: Publish release with APK.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hide-blocked-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "Publishing release $tag"
          gh release create "$tag" artifact/*.apk \
            --title "ForkClient with hide-from-blocked-users ($tag)" \
            --notes "ForkClient 13.2.3 (forkgram/TelegramAndroid dev 56e6bbe) + hide messages from blocked users in groups (port of forkgram/tdesktop PR #183). Enable in Fork Settings > Chats > Hide messages from blocked users. Signed with the in-repo test keystore, so it cannot update over an official ForkClient install; uninstall any existing copy first or use it standalone."
